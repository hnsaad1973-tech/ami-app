<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platinum Insurers</title>
<meta name="theme-color" content="#0B1B33">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B1B33;--card:#13284A;--line:#1F355C;--edge:#2B4470;--gold:#D4A84B;--text:#F5F1E6;--soft:#C9D2E0;--muted:#A9B4C6;--red:#E57373;--green:#7BC47F}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif}
  button,input,select,textarea{font-family:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--navy);padding:12px 14px 0;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .logo{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:20px;letter-spacing:2px;color:var(--gold);cursor:pointer}
  .sub{font-size:11px;color:var(--muted)}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who a{color:var(--gold);cursor:pointer;text-decoration:underline}
  .tabs{display:flex;gap:6px;padding:0 0 12px;overflow-x:auto}
  .tab{flex-shrink:0;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--edge);background:transparent;color:var(--soft);font-size:13px;font-weight:600;cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  main{padding:14px;max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:60px}
  #view{display:flex;flex-direction:column;gap:14px}
  h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:19px;margin:0}
  h3{margin:0;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .sec{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
  .sec:hover{border-color:var(--gold)}
  .sec b{font-family:'Space Grotesk',Inter,sans-serif;font-size:20px;color:var(--gold)}
  .sec span{font-size:13px;color:var(--soft);line-height:1.4}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .v{font-size:20px;font-weight:700;margin-top:4px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi.red .v{color:var(--red)}
  label{font-size:12px;font-weight:600;color:var(--soft);display:flex;flex-direction:column;gap:4px}
  input,select,textarea{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--edge);background:var(--navy);color:var(--text);font-size:16px}
  textarea{padding:10px 12px;min-height:70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .btn{min-height:46px;border:none;border-radius:10px;background:var(--gold);color:var(--navy);font-size:15px;font-weight:700;cursor:pointer;padding:0 16px}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
  .btn.sm{min-height:34px;font-size:13px;padding:0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
  td.wrap{white-space:normal;min-width:220px;max-width:420px}
  th{color:var(--muted);font-weight:600;background:#0F2240;position:sticky;top:0;z-index:1}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .msg{font-size:14px;padding:10px 12px;border-radius:10px;display:none;white-space:pre-line}
  .msg.ok{display:block;background:#173B2A;color:var(--green)}
  .msg.err{display:block;background:#3B1C1C;color:var(--red)}
  .note{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
  .hide{display:none!important}
  .quote{background:var(--navy);border:1px solid var(--gold);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.p{background:#3B2E10;color:var(--gold)}.pill.a{background:#173B2A;color:var(--green)}
  details summary{cursor:pointer;font-weight:700;color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="logo" id="home">PLATINUM</div><div class="sub" id="where">Insurers, Inc.</div></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs hide" id="tabs"></nav>
</header>

<main>
  <div id="msg" class="msg"></div>

  <section id="login" class="card hide" style="max-width:440px;margin:30px auto;width:100%">
    <h2>Sign in</h2>
    <p class="note">Platinum Insurers staff only. Enter your work email; we send you a sign-in code.</p>
    <label>Email<input id="em" type="email" autocomplete="email"></label>
    <button class="btn" id="sendcode">Send code</button>
    <div id="codebox" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <label>Code<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
      <button class="btn" id="verify">Sign in</button>
    </div>
  </section>

  <section id="chooser" class="hide">
    <h2 style="margin-bottom:12px">Choose a section</h2>
    <div class="sections" id="secs"></div>
  </section>

  <div id="view"></div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SB_URL = "https://xxdqrvcpxhsepwzfmnjs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4ZHFydmNweGhzZXB3emZtbmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MTQxNzQsImV4cCI6MjExMDE5MDE3NH0.ZjN4PXCs7IilwaO16o6kg1Bu1K66V_vfoUILHMjgGBU";
const sb = createClient(SB_URL, SB_KEY);
const $ = (id) => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);
const V = () => $("view");
let ME = null, LAST = [], TARIFF = [], CLASSES = [];

// ---------- helpers ----------
function say(t, ok = true) { const m = $("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); window.scrollTo({ top: 0, behavior: "smooth" }); if (ok) setTimeout(() => (m.className = "msg"), 7000); }
const money = (v) => v === null || v === undefined || v === "" ? "" : Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (v) => (v === null || v === undefined ? "" : String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])));
const isNum = (k, v) => v !== null && v !== "" && typeof v !== "boolean" && !isNaN(v) && !/(_no|code|phone|period|quarter|yr|^id$|last4|certificate|sev|items|policies|year|months)$/i.test(k) && !/date|_at$|due/i.test(k);
const label = (k) => k.replace(/_/g, " ").replace(/\bpct\b/, "%").replace(/^./, (c) => c.toUpperCase());
const LONG = /limits|deductible|eligibility|documents|exclusions|conditions|triggers|basis|reason|description|notes|item$|detail|who|rating/;

async function api(body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); throw new Error("Please sign in"); }
  const r = await fetch(SB_URL + "/functions/v1/plat", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SB_KEY }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "Server error" }));
  if (!r.ok || j.error) throw new Error(j.error || "Error " + r.status);
  return j;
}
const list = async (name) => (await api({ action: "list", name })).rows;
const run = (fn) => async (...a) => { try { await fn(...a); } catch (e) { say(e.message, false); } };

function table(box, rows, opts = {}) {
  box = typeof box === "string" ? $(box) : box;
  if (!rows || !rows.length) { box.innerHTML = '<p class="note" style="padding:12px">Nothing here yet.</p>'; return; }
  const cols = Object.keys(rows[0]).filter((c) => !(opts.hide || []).includes(c));
  let h = "<table><thead><tr>" + cols.map((c) => `<th>${label(c)}</th>`).join("") + (opts.extra ? "<th></th>" : "") + "</tr></thead><tbody>";
  for (const r of rows) {
    h += "<tr>" + cols.map((c) => {
      const v = r[c];
      if (c === "status" && (v === "proposed" || v === "approved")) return `<td><span class="pill ${v === "approved" ? "a" : "p"}">${v === "approved" ? "Approved" : "Proposed — for sign-off"}</span></td>`;
      if (/_pct$/.test(c) && v !== null && v !== "") return `<td class="n">${(Number(v) * 100).toFixed(1)}%</td>`;
      if (isNum(c, v)) return `<td class="n">${money(v)}</td>`;
      if (typeof v === "boolean") return `<td>${v ? "Yes" : "No"}</td>`;
      if (v && typeof v === "object") return `<td class="wrap">${esc(JSON.stringify(v)).slice(0, 200)}</td>`;
      const s = v === null || v === undefined ? "" : String(v);
      return `<td${LONG.test(c) ? ' class="wrap"' : ""}>${esc(/date|_at$|due/.test(c) ? s.slice(0, 10) : s)}</td>`;
    }).join("") + (opts.extra ? `<td>${opts.extra(r)}</td>` : "") + "</tr>";
  }
  box.innerHTML = h + "</tbody></table>";
}
const kpis = (arr) => `<div class="kpis">${arr.map(([l, v, red]) => `<div class="kpi${red ? " red" : ""}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div>`;
const printBtn = (no) => `<a class="btn ghost sm" style="display:inline-flex;align-items:center;text-decoration:none" href="print.html?no=${encodeURIComponent(no)}" target="_blank">Print</a>`;
const csvBtn = (name) => `<button class="btn ghost sm" data-csv="${name}">Download</button>`;
function bindCsv() {
  document.querySelectorAll("[data-csv]").forEach((b) => (b.onclick = () => {
    if (!LAST.length) return; const cols = Object.keys(LAST[0]);
    const csv = [cols.join(",")].concat(LAST.map((r) => cols.map((c) => `"${String(r[c] ?? "").replace(/"/g, '""')}"`).join(","))).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `platinum-${b.dataset.csv}-${today()}.csv`; a.click();
  }));
}

// ---------- sections by position ----------
const SECTIONS = {
  sales: { name: "Sales", desc: "Quote and issue policies, take payment, print, my clients and renewals.", roles: ["sales", "underwriter", "gm", "admin"],
    tabs: { s_new: "New policy", s_mine: "My policies", s_clients: "Clients", s_guide: "Product guide" } },
  uw: { name: "Underwriting", desc: "Approve referred risks, check documents, product rules, claims and treaty.", roles: ["underwriter", "gm", "admin"],
    tabs: { u_queue: "Approvals", u_all: "All policies", u_claims: "Claims", u_rules: "Product rules", u_treaty: "Africa Re" } },
  acct: { name: "Accounting", desc: "Receipts, debtors, commissions, payroll, month end, reports and compliance.", roles: ["accountant", "gm", "admin"],
    tabs: { a_receipts: "Receipts", a_debtors: "Debtors", a_comm: "Commissions", a_payroll: "Payroll", a_reports: "Reports", a_close: "Month end", a_comp: "Compliance" } },
  gm: { name: "General Manager", desc: "Company overview, alerts, approvals up to USD 1,000,000, compliance, board report.", roles: ["gm", "admin"],
    tabs: { g_over: "Overview", g_alerts: "Alerts", u_queue: "Approvals", a_comp: "Compliance", b_report: "Board report" } },
  ceo: { name: "CEO", desc: "Full access: overview, team and access, sign-off of product rules, audit trail.", roles: ["admin"],
    tabs: { g_over: "Overview", c_team: "Team & access", c_rules: "Sign off rules", c_audit: "Audit trail", g_alerts: "Alerts" } },
  board: { name: "Board", desc: "Monthly board report and risks above management limits for approval.", roles: ["board", "admin"],
    tabs: { b_report: "Monthly report", b_approvals: "Above-limit approvals", a_comp: "Compliance" } },
};

function showLogin() { $("login").classList.remove("hide"); $("chooser").classList.add("hide"); $("tabs").classList.add("hide"); V().innerHTML = ""; }
function showChooser() {
  V().innerHTML = ""; $("tabs").classList.add("hide"); $("where").textContent = "Insurers, Inc.";
  const mine = Object.entries(SECTIONS).filter(([, s]) => s.roles.includes(ME.role));
  if (mine.length === 1) return openSection(mine[0][0]);
  $("secs").innerHTML = mine.map(([k, s]) => `<button class="sec" data-sec="${k}"><b>${s.name}</b><span>${s.desc}</span></button>`).join("");
  document.querySelectorAll("[data-sec]").forEach((b) => (b.onclick = () => openSection(b.dataset.sec)));
  $("chooser").classList.remove("hide");
}
function openSection(k) {
  const s = SECTIONS[k];
  $("chooser").classList.add("hide"); $("where").textContent = s.name + " · tap PLATINUM for sections";
  $("tabs").innerHTML = Object.entries(s.tabs).map(([id, n], i) => `<button class="tab" data-t="${id}" aria-pressed="${i === 0}">${n}</button>`).join("");
  $("tabs").classList.remove("hide");
  document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => openTab(b.dataset.t)));
  openTab(Object.keys(s.tabs)[0]);
}
function openTab(id) {
  document.querySelectorAll("[data-t]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === id));
  V().innerHTML = '<p class="note">Loading…</p>';
  run(VIEWS[id])();
}
$("home").onclick = () => ME && showChooser();

// ---------- sign in ----------
$("sendcode").onclick = run(async () => {
  const email = $("em").value.trim(); if (!email) return;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  if (error) throw new Error(/signup|not allowed|not found/i.test(error.message) ? "This email is not set up. Ask management for access." : error.message);
  $("codebox").classList.remove("hide"); say("Code sent to " + email);
});
$("verify").onclick = run(async () => {
  const { error } = await sb.auth.verifyOtp({ email: $("em").value.trim(), token: $("code").value.trim(), type: "email" });
  if (error) throw new Error(error.message); start();
});

function tariffSelect(attr = "") {
  return `<select ${attr}><option value="">Tariff category…</option>${TARIFF.map((t) => `<option value="${t.id}">${esc(t.category)} — ${esc(t.sub_category)} · ${t.months} months · ${money(t.premium)}</option>`).join("")}</select>`;
}

// ---------- VIEWS ----------
const VIEWS = {
  // ===== SALES =====
  async s_new() {
    if (!TARIFF.length) TARIFF = await list("tariff");
    if (!CLASSES.length) CLASSES = await list("classes");
    V().innerHTML = `<div class="card">
      <h2>New policy</h2>
      <p class="note">The system prices every policy from the rate table. Motor third party is issued on the spot; other products go to underwriting for approval.</p>
      <div class="grid">
        <label>Product<select id="n_class">${CLASSES.filter((c) => !c.blocked).map((c) => `<option value="${c.code}">${esc(c.name)}</option>`).join("")}</select></label>
        <label>Client name<input id="n_holder" list="n_cl"></label>
        <label>Phone<input id="n_phone" inputmode="tel"></label>
        <label>Cover starts<input type="date" id="n_start" value="${today()}"></label>
      </div>
      <datalist id="n_cl"></datalist>
      <div class="card" style="background:var(--navy)">
        <div class="row" style="justify-content:space-between"><h3>Vehicles / items</h3><button class="btn ghost sm" id="n_add" type="button">+ Add</button></div>
        <div id="n_items"></div>
      </div>
      <button class="btn ghost" id="n_quote">Get price</button>
      <div id="n_q"></div>
      <div id="n_issue" class="hide card" style="background:var(--navy)">
        <div class="grid">
          <label>Paid now (USD)<input id="n_paid" inputmode="decimal"></label>
          <label>Paid by<select id="n_method"><option value="cash">Cash</option><option value="momo">Mobile money</option><option value="bank">Bank</option><option value="cheque">Cheque</option></select></label>
          <label>Receipt / reference<input id="n_ref"></label>
          <label id="n_ovL" class="hide">Premium (underwriter)<input id="n_ov" inputmode="decimal" placeholder="Blank = rate table"></label>
        </div>
        <label style="flex-direction:row;align-items:center;gap:8px" id="n_docsL"><input type="checkbox" id="n_docs" style="width:22px;min-height:22px"> Documents seen and checked</label>
        <button class="btn" id="n_go">Issue policy</button>
      </div>
    </div>`;
    if (["underwriter", "gm", "admin"].includes(ME.role)) $("n_ovL").classList.remove("hide"); else $("n_docsL").classList.add("hide");
    list("clients").then((c) => ($("n_cl").innerHTML = c.map((x) => `<option value="${esc(x.name)}">`).join(""))).catch(() => {});
    const isTariff = () => ["MTPL", "MFLEET"].includes($("n_class").value);
    const addItem = () => {
      const d = document.createElement("div"); d.className = "grid it"; d.style.cssText = "border-top:1px solid var(--line);padding-top:10px";
      d.innerHTML = (isTariff() ? `<label style="grid-column:1/-1">Tariff category${tariffSelect('data-k="tariff_id"')}</label>` : "") +
        `<label>Description<input data-k="description"></label><label>Plate no.<input data-k="plate_no"></label><label>Chassis / VIN<input data-k="chassis_vin"></label>
         <label>Make / model<input data-k="make_model"></label><label>Year<input data-k="year" inputmode="numeric"></label>
         <label>Use / location<input data-k="use_category"></label>` + ($("n_class").value === "MTPL" ? "" : `<label>Value / sum insured (USD)<input data-k="sum_insured" inputmode="decimal"></label>`);
      $("n_items").appendChild(d);
    };
    const reset = () => { $("n_items").innerHTML = ""; addItem(); $("n_q").innerHTML = ""; $("n_issue").classList.add("hide"); };
    $("n_class").onchange = reset; $("n_add").onclick = addItem; reset();
    const read = () => ({
      class_code: $("n_class").value, holder: $("n_holder").value.trim(), phone: $("n_phone").value.trim(), start_date: $("n_start").value,
      items: [...document.querySelectorAll("#n_items .it")].map((d) => { const o = {}; d.querySelectorAll("[data-k]").forEach((i) => (o[i.dataset.k] = i.value.trim())); return o; }),
      premium_override: $("n_ov").value, paid: $("n_paid").value, method: $("n_method").value, ref: $("n_ref").value, docs_verified: $("n_docs").checked,
    });
    $("n_quote").onclick = run(async () => {
      const { quote: q } = await api({ action: "quote", p: read() });
      $("n_q").innerHTML = `<div class="quote">
        <b style="font-size:18px;color:var(--gold)">Premium USD ${money(q.premium)}</b> + fees ${money(q.fee)} = <b>USD ${money(q.total)}</b><br>
        Cover ${q.start_date} to ${q.end_date}${q.sum_insured ? ` · Sum insured USD ${money(q.sum_insured)}` : ""}<br>
        <b>Limits:</b> ${esc(q.limits)}<br><b>Deductible:</b> ${esc(q.deductible)}<br><b>Documents needed:</b> ${esc(q.documents)}<br>
        ${q.refer ? `<b style="color:var(--red)">Goes to ${esc(q.referred_to)} for approval:</b> ${esc(q.why)}` : `<b style="color:var(--green)">Can be issued now.</b>`}
        ${q.rule_status === "proposed" ? '<br><span class="pill p">Rates proposed — not yet signed off</span>' : ""}</div>`;
      $("n_issue").classList.remove("hide"); $("n_go").textContent = q.refer ? "Send for approval" : "Issue policy";
    });
    $("n_go").onclick = run(async () => {
      const { policy: p } = await api({ action: "create_policy", p: read() });
      if (p.uw_status === "referred") say(`${p.policy_no} sent to ${p.referred_to} for approval.\n${p.referral_reason}`);
      else { say(`${p.policy_no} issued · ${p.status === "active" ? "paid, cover in force" : "not yet paid — no cover until paid"}`); window.open("print.html?no=" + encodeURIComponent(p.policy_no), "_blank"); }
      ["n_holder", "n_phone", "n_paid", "n_ref", "n_ov"].forEach((i) => ($(i).value = "")); reset();
    });
  },
  async s_mine() {
    const rows = (await api({ action: "my_policies" })).rows;
    const soon = rows.filter((r) => r.uw_status === "approved" && r.end_date && new Date(r.end_date) - new Date() < 30 * 864e5 && r.end_date >= today());
    V().innerHTML = `<div class="card"><h2>Take a payment</h2><div class="grid">
        <label>Policy no.<select id="r_pol">${rows.filter((r) => r.uw_status === "approved" && Number(r.balance) > 0).map((r) => `<option value="${esc(r.policy_no)}">${esc(r.policy_no)} — ${esc(r.holder)} (${money(r.balance)})</option>`).join("")}</select></label>
        <label>Amount (USD)<input id="r_amt" inputmode="decimal"></label>
        <label>Paid by<select id="r_m"><option value="cash">Cash</option><option value="momo">Mobile money</option><option value="bank">Bank</option><option value="cheque">Cheque</option></select></label>
        <label>Receipt / reference<input id="r_ref"></label></div><button class="btn" id="r_go">Record payment</button></div>
      ${soon.length ? `<div class="card"><h2>Renewals due in 30 days</h2><div class="tablewrap" id="t_soon"></div></div>` : ""}
      <div class="card"><h2>My policies</h2><div class="tablewrap" id="t_mine"></div></div>`;
    if (soon.length) table("t_soon", soon, { hide: ["id", "class_code", "created_by", "referred_to", "docs_verified_at", "items"], extra: (r) => printBtn(r.policy_no) });
    table("t_mine", rows, { hide: ["id", "class_code", "created_by"], extra: (r) => r.uw_status === "approved" ? printBtn(r.policy_no) : "" });
    $("r_go").onclick = run(async () => { const r = await api({ action: "add_receipt", r: { policy_no: $("r_pol").value, amount: $("r_amt").value, method: $("r_m").value, ref: $("r_ref").value } }); say(`Payment recorded · ${r.policy.policy_no} ${r.policy.status === "active" ? "is now in force" : "is still part-paid"}`); VIEWS.s_mine(); });
  },
  async s_clients() { LAST = await list("clients"); V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Clients</h2>${csvBtn("clients")}</div><div class="tablewrap" id="t"></div></div>`; table("t", LAST, { hide: ["id"] }); bindCsv(); },
  async s_guide() {

  // ===== UNDERWRITING =====
  async u_queue() {
    const rows = await list("uw_queue");
    const mine = ME.role === "board" ? rows.filter((r) => r.board_approval && r.uw_status === "referred") : rows;
    V().innerHTML = `<div class="card"><h2>${ME.role === "board" ? "Risks above management limits" : "Waiting for a decision"}</h2>
      <p class="note">Underwriting approves up to its limit, the General Manager up to USD 1,000,000, and the Board above that. Approving puts the policy on the books and cedes to Africa Re.</p>
      <div class="tablewrap" id="t"></div></div>
      <div class="card"><h3>Approval limits</h3><div class="tablewrap"><table><tbody>
      <tr><td>Sales</td><td>Motor third party on the tariff only</td></tr><tr><td>Underwriting</td><td>Up to USD 250,000 per risk</td></tr>
      <tr><td>General Manager</td><td>Up to USD 1,000,000; motor comprehensive over 100,000; vehicles over 10 years</td></tr>
      <tr><td>Board / CEO</td><td>Above USD 1,000,000 or above product capacity — facultative first; bonds</td></tr></tbody></table></div></div>`;
    table("t", mine, { extra: (r) => {
      let h = printBtn(r.policy_no) + " ";
      if (r.uw_status === "referred") h += `<button class="btn sm" data-ok="${esc(r.policy_no)}">Approve</button> <button class="btn ghost sm" data-no="${esc(r.policy_no)}">Decline</button>`;
      else if (!r.docs_verified_at && ME.role !== "board") h += `<button class="btn sm" data-doc="${esc(r.policy_no)}">Documents checked</button>`;
      return `<span class="row" style="flex-wrap:nowrap">${h}</span>`; } });
    document.querySelectorAll("[data-ok]").forEach((b) => (b.onclick = run(async () => {
      const note = prompt(`Approve ${b.dataset.ok}?\nConditions or note (optional). For risks above capacity write "fac confirmed" once facultative is in writing.`); if (note === null) return;
      const prem = ["underwriter", "gm", "admin"].includes(ME.role) ? prompt("New premium in USD (leave blank to keep the quoted premium)") : "";
      await api({ action: "uw_decide", policy_no: b.dataset.ok, decision: "approve", reason: note, premium: prem, fac_confirmed: /fac/i.test(note) });
      say(b.dataset.ok + " approved"); VIEWS.u_queue(); })));
    document.querySelectorAll("[data-no]").forEach((b) => (b.onclick = run(async () => {
      const reason = prompt("Reason for declining " + b.dataset.no); if (reason === null) return;
      await api({ action: "uw_decide", policy_no: b.dataset.no, decision: "decline", reason }); say(b.dataset.no + " declined"); VIEWS.u_queue(); })));
    document.querySelectorAll("[data-doc]").forEach((b) => (b.onclick = run(async () => {
      const r = await api({ action: "verify_docs", policy_no: b.dataset.doc }); say(`Documents checked · claims accepted for losses from ${String(r.claims_from).slice(0, 10)}`); VIEWS.u_queue(); })));
  },
  async u_all() { LAST = await list("policies"); V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>All policies</h2>${csvBtn("policies")}</div><div class="tablewrap" id="t"></div></div>`; table("t", LAST, { hide: ["id", "class_code"], extra: (r) => printBtn(r.policy_no) }); bindCsv(); },
  async u_claims() {
    const cl = await list("claims");
    V().innerHTML = `<div class="card"><h2>New claim</h2><p class="note">Only for losses inside the policy period and from 15 days after documents were checked. The product's deductible applies.</p><div class="grid">
        <label>Policy no.<input id="c_pol"></label><label>Date of loss<input type="date" id="c_loss" value="${today()}"></label><label>First reserve (USD)<input id="c_res" inputmode="decimal"></label></div>
        <label>What happened<textarea id="c_desc"></textarea></label><button class="btn" id="c_go">Open claim</button></div>
      <div class="card"><h2>Update a claim</h2><div class="grid">

        <label>Type<select id="m_kind"><option value="reserve">New reserve (still to pay)</option><option value="payment">Payment (net of deductible)</option><option value="salvage">Salvage / recovery</option></select></label>
        <label>Amount (USD)<input id="m_amt" inputmode="decimal"></label><label>Close<select id="m_close"><option value="">No</option><option value="1">Yes</option></select></label></div>

  async u_rules() { await rulesView(false); },
  async u_treaty() {

    table("t1", t, { hide: ["terms_source", "reinsurer"] }); table("t2", x);

  // ===== ACCOUNTING =====
  async a_receipts() {

    V().innerHTML = `<div class="card"><h2>Record a receipt</h2><div class="grid">

  async a_debtors() { LAST = await list("debtors"); V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Premium owed to Platinum</h2>${csvBtn("debtors")}</div><div class="tablewrap" id="t"></div></div>`; table("t", LAST); bindCsv(); },

    V().innerHTML = `<div class="card"><h2>Pay a broker / agent</h2><div class="grid"><label>Broker<input id="k_b"></label><label>Amount (USD)<input id="k_a" inputmode="decimal"></label>

  async a_payroll() {
    const [st, ps] = await Promise.all([list("staff"), list("payroll")]);
    V().innerHTML = `<div class="card"><h2>Staff</h2><div class="tablewrap" id="t1"></div>
        <details><summary>Add staff</summary><div class="grid" style="margin-top:10px"><label>Name<input id="s_n"></label><label>Position<input id="s_p"></label><label>Salary (USD)<input id="s_s" inputmode="decimal"></label><label>Allowances<input id="s_a" inputmode="decimal"></label></div><button class="btn" id="s_go" style="margin-top:10px">Add</button></details></div>
      <div class="card"><h2>Run payroll</h2><p class="note">PAYE on LRA bands; NASSCORP 4% staff, 6% company.</p><div class="grid">
        <label>Month (YYYY-MM)<input id="p_per" value="${today().slice(0, 7)}"></label><label>Pay date<input type="date" id="p_d" value="${today()}"></label><label>USD → LRD rate<input id="p_fx" inputmode="decimal"></label></div><button class="btn" id="p_go">Run payroll</button></div>
      <div class="card"><h2>Payslips</h2><div class="tablewrap" id="t2"></div></div>`;

    table("t2", ps);
    document.querySelectorAll("[data-st]").forEach((b) => (b.onclick = run(async () => { const id = b.dataset.st; await api({ action: "update_staff", s: { id: +id, name: decodeURIComponent(b.dataset.n), position: decodeURIComponent(b.dataset.p), basic_salary: $("sal" + id).value, allowances: $("all" + id).value } }); say("Saved"); })));
    $("s_go").onclick = run(async () => { await api({ action: "update_staff", s: { name: $("s_n").value, position: $("s_p").value, basic_salary: $("s_s").value, allowances: $("s_a").value } }); say("Staff added"); VIEWS.a_payroll(); });
    $("p_go").onclick = run(async () => { await api({ action: "run_payroll", period: $("p_per").value, run_date: $("p_d").value, fx: $("p_fx").value }); say("Payroll posted"); VIEWS.a_payroll(); });
  },
  async a_reports() {
    V().innerHTML = `<div class="card"><div class="row"><select id="rep" style="flex:1">
      <option value="tb">Trial balance</option><option value="pnl">Profit & loss by month</option><option value="journals">Journal entries</option>
      <option value="africa_re">Africa Re quarterly statement</option><option value="prem_bdx">Premium bordereau</option><option value="clm_bdx">Claims bordereau</option>
      <option value="retention">Retention (CBL 20%)</option><option value="banks">Bank accounts</option><option value="policies">All policies</option><option value="claims">Claims</option></select>${csvBtn("report")}</div>
      <div class="tablewrap" id="t"></div></div>`;
    const load = run(async () => { LAST = await list($("rep").value); table("t", LAST); });
    $("rep").onchange = load; await load(); bindCsv();
  },
  async a_close() {
    V().innerHTML = `<div class="card"><h2>Month end</h2><p class="note">Works out unearned premium for the gross book and Africa Re's share. Run on the last day of each month, then open the board report.</p>
      <div class="row"><label style="flex:1">Month-end date<input type="date" id="me_d" value="${today()}"></label><button class="btn" id="me_go" style="align-self:flex-end">Run month end</button></div></div>`;
    $("me_go").onclick = run(async () => { await api({ action: "month_end", date: $("me_d").value }); say("Month end posted"); });
  },
  async a_comp() {
    LAST = await list("compliance"); const canEdit = ["accountant", "gm", "admin"].includes(ME.role);
    V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Compliance — CBL, tax and treaty</h2>${csvBtn("compliance")}</div><div class="tablewrap" id="t"></div>
      ${canEdit ? `<details><summary>Add an item</summary><div class="grid" style="margin-top:10px"><label>Item<input id="cp_i"></label><label>Regulation<input id="cp_r"></label><label>Due<input type="date" id="cp_d"></label><label>Owner<input id="cp_o"></label></div><button class="btn" id="cp_go" style="margin-top:10px">Add</button></details>` : ""}</div>`;
    table("t", LAST, { hide: ["id"], extra: canEdit ? (r) => (r.status !== "done" ? `<button class="btn sm" data-done="${r.id}">Done</button>` : "") : null }); bindCsv();
    document.querySelectorAll("[data-done]").forEach((b) => (b.onclick = run(async () => { const r = LAST.find((x) => x.id == b.dataset.done); await api({ action: "update_compliance", c: { id: r.id, status: "done", due_date: r.due_date, notes: r.notes } }); say("Marked done"); VIEWS.a_comp(); })));
    if (canEdit) $("cp_go").onclick = run(async () => { await api({ action: "update_compliance", c: { item: $("cp_i").value, regulation: $("cp_r").value, due_date: $("cp_d").value, owner: $("cp_o").value } }); say("Added"); VIEWS.a_comp(); });
  },

  // ===== GM / CEO =====
  async g_over() {
    const { d } = await api({ action: "dashboard" });
    V().innerHTML = kpis([
      ["Premium written", money(d.gwp)], ["Result so far", money(d.result), d.result < 0], ["Premium owed to us", money(d.receivable)], ["Cash and bank", money(d.cash), d.cash < 0],
      ["Claims reserve", money(d.claims_reserve)], ["Policies in force", d.policies], ["Waiting for approval", d.referred], ["Waiting for Board", d.board_pending, d.board_pending > 0],
      ["Open claims", d.open_claims], ["Urgent alerts", d.urgent, d.urgent > 0], ["Compliance overdue", d.compliance_overdue, d.compliance_overdue > 0],
      ["Kept by Platinum", d.retained_pct == null ? "—" : (d.retained_pct * 100).toFixed(1) + "%"], ["Product rules not signed", d.rules_unsigned, d.rules_unsigned > 0],
    ]) + `<div class="card"><h2>Urgent</h2><div class="tablewrap" id="t"></div></div>`;
    table("t", (await list("alerts")).filter((a) => a.sev === 1), { hide: ["sev"] });
  },
  async g_alerts() { LAST = await list("alerts"); V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Alerts</h2>${csvBtn("alerts")}</div><p class="note">Renewals due, expired policies, approvals waiting, documents not checked, premium unpaid over 60 days, compliance deadlines.</p><div class="tablewrap" id="t"></div></div>`; table("t", LAST, { hide: ["sev"] }); bindCsv(); },
  async c_team() {
    const u = await list("users");
    V().innerHTML = `<div class="card"><h2>Who has access</h2><div class="tablewrap" id="t"></div></div>
      <div class="card"><h2>Add or change a person</h2><div class="grid">
        <label>Email<input id="u_e" type="email"></label><label>Name<input id="u_n"></label><label>Position<input id="u_t" placeholder="e.g. Sales officer"></label>
        <label>Access<select id="u_r">
          <option value="sales">Sales — sales section only</option><option value="underwriter">Underwriting — sales + underwriting</option>
          <option value="accountant">Accounting — accounting section only</option><option value="gm">General Manager — sales, underwriting, accounting, GM</option>
          <option value="board">Board — board report and above-limit approvals</option><option value="admin">CEO — everything</option><option value="viewer">View only</option></select></label>
        <label>Approval limit (USD)<input id="u_l" inputmode="decimal" placeholder="Underwriting 250000 · GM 1000000"></label></div>
        <p class="note">They need an AMI sign-in for the same email; ask Claude to set one up if they don't have one.</p><button class="btn" id="u_go">Save</button></div>`;
    table("t", u);

  },
  async c_rules() { await rulesView(true); },
  async c_audit() { LAST = await list("audit"); V().innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Audit trail — who did what</h2>${csvBtn("audit")}</div><div class="tablewrap" id="t"></div></div>`; table("t", LAST); bindCsv(); },

  // ===== BOARD =====
  async b_report() {
    const def = new Date(Date.now() - 20 * 864e5).toISOString().slice(0, 7);
    V().innerHTML = `<div class="card"><h2>Monthly board report</h2><p class="note">Built automatically from the books: results, balance sheet, policies, claims, retention, above-limit approvals, top debtors, compliance and treaty status.</p>
      <div class="row"><label style="flex:1">Month<input type="month" id="b_m" value="${def}"></label><a class="btn" id="b_open" target="_blank" style="align-self:flex-end;display:inline-flex;align-items:center;text-decoration:none">Open report</a></div></div>`;

  async b_approvals() { await VIEWS.u_queue(); },
};

async function rulesView(ceo) {
  const rules = await list("rules");
  const canEdit = ["underwriter", "gm", "admin"].includes(ME.role);
  V().innerHTML = `<div class="card"><h2>${ceo ? "Sign off product rules" : "Product underwriting rules"}</h2>
    <p class="note">One rule per product: rating, minimum premium, limits, deductibles, eligibility, documents, exclusions, conditions and referral triggers. ${ceo ? "Approve each product once you agree its figures." : "Changes go back to 'Proposed' until the CEO signs them off."}</p>
    <label>Product<select id="rl_c">${rules.map((r) => `<option value="${r.class_code}">${esc(r.name)} — ${r.status === "approved" ? "approved" : "proposed"}</option>`).join("")}</select></label>
    <div id="rl_f"></div></div>
    <div class="card"><h2>All products</h2><div class="tablewrap" id="t"></div></div>`;
  table("t", rules.map((r) => ({ product: r.name, status: r.status, rate: r.rate, unit: r.rate_unit, min_premium: r.min_premium, refer_above: r.max_auto_value, max_value: r.max_value, deductible: r.deductible })));
  const F = ["rating_basis", "rate", "min_premium", "policy_fee", "max_auto_value", "max_value", "limits", "deductible", "deductible_pct", "deductible_min", "eligibility", "documents", "exclusions", "conditions", "referral_triggers"];
  const show = () => {
    const r = rules.find((x) => x.class_code === $("rl_c").value);
    $("rl_f").innerHTML = `<p class="note">Status: <span class="pill ${r.status === "approved" ? "a" : "p"}">${r.status === "approved" ? "Approved by " + esc(r.approved_by) : "Proposed — for sign-off"}</span> · Pattern ${esc(r.pattern)} · Rate unit: ${esc(r.rate_unit)} · Treaty: ${esc(r.treaty_section)}</p>
      <div class="grid">${F.map((k) => /^(rate|min_premium|policy_fee|max_auto_value|max_value|deductible_pct|deductible_min)$/.test(k)
        ? `<label>${label(k)}<input data-f="${k}" value="${esc(r[k] ?? "")}" ${canEdit ? "" : "disabled"} inputmode="decimal"></label>`
        : `<label style="grid-column:1/-1">${label(k)}<textarea data-f="${k}" ${canEdit ? "" : "disabled"}>${esc(r[k] ?? "")}</textarea></label>`).join("")}
      <label>Always refer<select data-f="always_refer" ${canEdit ? "" : "disabled"}><option value="">No</option><option value="1" ${r.always_refer ? "selected" : ""}>Yes</option></select></label></div>
      ${canEdit ? `<div class="row"><button class="btn ghost" id="rl_s">Save as proposed</button>${ME.role === "admin" ? '<button class="btn" id="rl_a">Approve and sign off</button>' : ""}</div>` : ""}`;
    const save = (status) => run(async () => {
      const o = { class_code: r.class_code, status }; document.querySelectorAll("[data-f]").forEach((i) => (o[i.dataset.f] = i.value)); o.always_refer = !!o.always_refer;
      const x = await api({ action: "save_rule", r: o }); say(`${r.name}: ${x.status === "approved" ? "approved and signed off" : "saved as proposed"}`); rulesView(ceo);
    });
    if ($("rl_s")) $("rl_s").onclick = save("proposed"); if ($("rl_a")) $("rl_a").onclick = save("approved");
  };
  $("rl_c").onchange = show; show();
}

async function start() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return showLogin();
    ME = (await api({ action: "me" })).me;
    $("login").classList.add("hide");
    $("who").innerHTML = `${esc(ME.name || ME.email)}<br>${esc(ME.title || ME.role)} · <a id="out">Sign out</a>`;
    $("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    showChooser();
  } catch (e) { say(e.message, false); showLogin(); }
}
start();
</script>

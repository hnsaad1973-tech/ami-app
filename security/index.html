<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compound Security">
<title>Compound Security — Message the Gate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B1B33;--card:#13284A;--line:#1F355C;--gold:#D4A84B;--text:#F5F1E6;--soft:#C9D2E0;--muted:#A9B4C6;--ok:#5BC08A;--bad:#E07A6B}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  header .t{font-weight:700;font-size:18px}
  header .s{color:var(--muted);font-size:13px;margin-top:2px}
  header .u{color:var(--gold);font-weight:600}
  main{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:13px;color:var(--soft);margin-bottom:8px}
  input,textarea{width:100%;background:#0E2241;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:17px;padding:12px}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
  .pin{letter-spacing:10px;text-align:center;font-size:24px}
  button{background:var(--gold);color:#1A1405;border:0;border-radius:10px;font-weight:700;font-size:16px;padding:13px 16px;cursor:pointer}
  button:disabled{opacity:.5}
  .full{width:100%;margin-top:12px}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:#2B4470;border-bottom-right-radius:4px}
  .them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .meta{font-size:11px;color:var(--muted);margin-top:4px}
  .empty{color:var(--muted);text-align:center;font-size:14px;margin-top:30px}
  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 8px}
  .quick button{background:transparent;color:var(--soft);border:1px solid var(--edge,#2B4470);font-weight:500;font-size:13px;padding:8px 11px;border-radius:999px}
  footer{padding:10px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  footer textarea{flex:1;resize:none;height:48px;font-size:16px;padding:12px}
  .note{color:var(--muted);font-size:12px;text-align:center;padding:0 18px 10px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">Compound Security</div>
    <div class="s" id="sub">Message the security booth</div>
  </header>

  <main id="login">
    <div class="card">
      <label for="pin">Enter your unit's 4-digit PIN</label>
      <input id="pin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
      <button class="full" id="go">Open</button>
      <div class="err" id="lerr"></div>
    </div>
    <div class="note">Your phone number is never shared with the guards. They see your unit number only.</div>
  </main>

  <main id="chat" class="hidden"></main>
  <div class="quick hidden" id="quick">
    <button data-t="Visitor arriving now, please let them in.">Visitor arriving</button>
    <button data-t="My driver is coming in.">Driver coming</button>
    <button data-t="Delivery expected, please call me when it arrives.">Delivery</button>
    <button data-t="Please send a guard to my unit.">Send a guard</button>
  </div>
  <div class="note hidden" id="emer">In an emergency, also call the guard post or the police directly.</div>
  <footer class="hidden" id="bar">
    <textarea id="txt" placeholder="Message to security…" maxlength="500"></textarea>
    <button id="send">Send</button>
  </footer>
</div>
<script>
const API = "https://pdzhlslzwjlhxklqcwus.supabase.co/functions/v1/secrelay";
const token = new URLSearchParams(location.search).get("u") || "";
let pin = "", timer = null, last = "";
const $ = (id) => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_){} }, del(k){ try { localStorage.removeItem(k); } catch(_){} } };

async function call(action, extra) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ action, token, pin }, extra || {})) });
  const j = await r.json().catch(() => ({ error: "No connection. Try again." }));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
function time(iso) { const d = new Date(iso); return d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function render(msgs) {
  const key = JSON.stringify(msgs.map(m => m.created_at));
  if (key === last) return; last = key;
  const c = $("chat"); c.innerHTML = "";
  if (!msgs.length) { c.innerHTML = '<div class="empty">No messages yet. Send the security booth a message below.</div>'; return; }
  for (const m of msgs) {
    const d = document.createElement("div");
    d.className = "msg " + (m.dir === "tenant" ? "me" : "them");
    d.textContent = m.body;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (m.dir === "tenant" ? "You" : "Security") + " · " + time(m.created_at);
    d.appendChild(meta); c.appendChild(d);
  }
  c.scrollTop = c.scrollHeight;
}
function show(unit, msgs) {
  $("login").classList.add("hidden");
  ["chat","quick","bar","emer"].forEach(id => $(id).classList.remove("hidden"));
  $("sub").innerHTML = 'Unit <span class="u"></span> · Messages go to the security booth';
  $("sub").querySelector(".u").textContent = unit;
  render(msgs);
  clearInterval(timer);
  timer = setInterval(async () => { try { const j = await call("open"); render(j.messages); } catch(_){} }, 10000);
}
async function open() {
  $("lerr").textContent = ""; $("go").disabled = true;
  try { const j = await call("open"); store.set("sec_pin_" + token, pin); show(j.unit, j.messages); }
  catch (e) { $("lerr").textContent = e.message; store.del("sec_pin_" + token); }
  finally { $("go").disabled = false; }
}
async function send(text) {
  text = (text || "").trim(); if (!text) return;
  $("send").disabled = true;
  try { const j = await call("send", { text }); $("txt").value = ""; render(j.messages);
    if (!j.delivered) alert("Saved, but the booth phone could not be reached right now. If urgent, call the guard post."); }
  catch (e) { alert(e.message); }
  finally { $("send").disabled = false; }
}
$("go").onclick = () => { pin = $("pin").value.trim(); open(); };
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("send").onclick = () => send($("txt").value);
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
document.querySelectorAll("#quick button").forEach(b => b.onclick = () => { $("txt").value = b.dataset.t; $("txt").focus(); });

if (!token) { $("lerr").textContent = "This link is not complete. Please use the QR code or link for your unit."; $("go").disabled = true; }
else { const saved = store.get("sec_pin_" + token); if (saved) { pin = saved; open(); } }
</script>
</body>
</html>
